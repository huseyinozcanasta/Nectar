name: Nectar fork validation
on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: Branch or commit to validate
        required: true
        default: main
      build_portable:
        description: Build a standalone Windows executable artifact
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo test --bin nectar
        working-directory: src-tauri

  portable:
    if: ${{ inputs.build_portable }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Build test executable
        run: bun run tauri build --no-bundle
      - name: Generate SHA256
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/nectar.exe'
          if (!(Test-Path $exe)) { throw 'Expected executable not found' }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  nectar.exe" | Set-Content -Path 'src-tauri/target/release/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: nectar-experimental-windows-x64
          path: |
            src-tauri/target/release/nectar.exe
            src-tauri/target/release/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
